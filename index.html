<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ガチ鬼ごっこ：2回戦バトル</title>
    <style>
        body { margin: 0; background: #222; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 800px; height: 600px; border: 5px solid #555; background: #333; }
        canvas { display: block; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 100; }
        .hidden { display: none; }
        h1 { color: #ffeb3b; margin-bottom: 10px; }
        .instruction-box { background: #444; padding: 20px; border-radius: 10px; text-align: left; margin-bottom: 20px; line-height: 1.6; border: 1px solid #666; }
        .key { background: #eee; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        button { padding: 15px 40px; font-size: 20px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 5px; font-weight: bold; }
        button:hover { background: #45a049; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; padding: 10px; display: flex; justify-content: space-around; font-size: 18px; font-weight: bold; background: rgba(0,0,0,0.3); pointer-events: none; }
        .tag-count { color: #ff5252; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud" class="hidden">
        <div>残り時間: <span id="timer">30</span>s</div>
        <div>ラウンド: <span id="round-num">1</span>/2</div>
        <div>現在の鬼: <span id="oni-label">-</span></div>
        <div>スコア (左:<span id="score-left">0</span> vs 右:<span id="score-right">0</span>)</div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="start-screen" class="overlay">
        <h1>ガチ鬼ごっこ：2回戦バトル</h1>
        <div class="instruction-box">
            <strong>【基本ルール】</strong><br>
            ・全2ラウンド制（各30秒）。交代で1回ずつ鬼をやります。<br>
            ・鬼は逃げる側に触れて「捕まえた回数」を稼いでください。<br>
            ・捕まった側は反対側にテレポートして逃げ直します。<br>
            ・鬼は逃げる側より<b>少しだけ足が速い</b>です！<br><br>
            <strong>【操作方法】</strong><br>
            ・左プレイヤー: <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span><br>
            ・右プレイヤー: <span class="key">I</span><span class="key">J</span><span class="key">K</span><span class="key">L</span> (I=上, J=左, K=下, L=右)<br><br>
            <strong>【ギミック】</strong><br>
            ・<span style="color:yellow">●</span> アイテム：3秒間スピードアップ！<br>
            ・中央の白い棒：上下に動くので注意！
        </div>
        <button onclick="initRound(1)">第1ラウンド開始！</button>
    </div>

    <div id="intermission-screen" class="overlay hidden">
        <h1 id="intermission-title">ラウンド1終了！</h1>
        <p id="intermission-text"></p>
        <button id="next-round-btn" onclick="initRound(2)">第2ラウンド（攻守交代）へ</button>
    </div>

    <div id="result-screen" class="overlay hidden">
        <h1>最終結果</h1>
        <h2 id="final-winner" style="font-size: 40px;"></h2>
        <p id="final-stats"></p>
        <button onclick="location.reload()">もう一度遊ぶ</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 設定
const ROUND_TIME = 30;
const SPEED_ONI = 5.5;
const SPEED_RUNNER = 4.5;
const ITEM_BOOST = 2.5;

let currentRound = 1;
let timeLeft = ROUND_TIME;
let timerId;
let gameActive = false;

let scoreLeft = 0;
let scoreRight = 0;

const keys = {};
window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

// プレイヤーオブジェクト
const pLeft = { x: 100, y: 300, size: 25, color: '#42a5f5', label: '左', boostTimer: 0 };
const pRight = { x: 675, y: 300, size: 25, color: '#ef5350', label: '右', boostTimer: 0 };

// 障害物
const obstacles = [
    { x: 150, y: 100, w: 50, h: 50 },
    { x: 600, y: 100, w: 50, h: 50 },
    { x: 150, y: 450, w: 50, h: 50 },
    { x: 600, y: 450, w: 50, h: 50 }
];
const movingWall = { x: 390, y: 200, w: 20, h: 100, dir: 1, speed: 3 };

// アイテム
let item = { x: 0, y: 0, active: false, size: 15 };

function initRound(round) {
    currentRound = round;
    timeLeft = ROUND_TIME;
    gameActive = true;
    
    // 位置リセット
    pLeft.x = 100; pLeft.y = 300; pLeft.boostTimer = 0;
    pRight.x = 675; pRight.y = 300; pRight.boostTimer = 0;
    
    // 画面切り替え
    document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
    document.getElementById('hud').classList.remove('hidden');
    
    document.getElementById('round-num').innerText = currentRound;
    document.getElementById('oni-label').innerText = (currentRound === 1) ? "左 (WASD)" : "右 (JKLI)";
    document.getElementById('oni-label').style.color = (currentRound === 1) ? pLeft.color : pRight.color;

    if(timerId) clearInterval(timerId);
    timerId = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if (timeLeft <= 0) endRound();
    }, 1000);

    spawnItem();
    requestAnimationFrame(update);
}

function spawnItem() {
    item.x = 200 + Math.random() * 400;
    item.y = 100 + Math.random() * 400;
    item.active = true;
}

function endRound() {
    gameActive = false;
    clearInterval(timerId);
    
    if (currentRound === 1) {
        document.getElementById('intermission-screen').classList.remove('hidden');
        document.getElementById('intermission-text').innerText = `左プレイヤーが捕まえた回数: ${scoreLeft}回`;
    } else {
        showFinalResult();
    }
}

function showFinalResult() {
    document.getElementById('result-screen').classList.remove('hidden');
    let winnerText = "";
    if (scoreLeft > scoreRight) winnerText = "左プレイヤーの勝利！";
    else if (scoreRight > scoreLeft) winnerText = "右プレイヤーの勝利！";
    else winnerText = "引き分け！";
    
    document.getElementById('final-winner').innerText = winnerText;
    document.getElementById('final-stats').innerText = `左: ${scoreLeft}回 vs 右: ${scoreRight}回`;
}

function update() {
    if (!gameActive) return;

    const oni = (currentRound === 1) ? pLeft : pRight;
    const runner = (currentRound === 1) ? pRight : pLeft;

    // 移動処理
    movePlayer(pLeft, 'w', 's', 'a', 'd', (currentRound === 1));
    movePlayer(pRight, 'i', 'k', 'j', 'l', (currentRound === 2));

    // 動く壁の更新
    movingWall.y += movingWall.speed * movingWall.dir;
    if (movingWall.y < 50 || movingWall.y > 450) movingWall.dir *= -1;

    // 衝突判定：障害物
    checkWallCollision(pLeft);
    checkWallCollision(pRight);

    // 衝突判定：アイテム
    if (item.active) {
        if (getDist(pLeft, item) < 25) { pLeft.boostTimer = 180; item.active = false; setTimeout(spawnItem, 5000); }
        if (getDist(pRight, item) < 25) { pRight.boostTimer = 180; item.active = false; setTimeout(spawnItem, 5000); }
    }

    // 衝突判定：鬼と逃げる側
    if (getDist(pLeft, pRight) < 25) {
        if (currentRound === 1) scoreLeft++; else scoreRight++;
        document.getElementById('score-left').innerText = scoreLeft;
        document.getElementById('score-right').innerText = scoreRight;
        
        // 捕まったら反対側へリスポーン
        runner.x = (currentRound === 1) ? 100 : 675;
        runner.y = 300;
    }

    draw();
    requestAnimationFrame(update);
}

function movePlayer(p, up, down, left, right, isOni) {
    let speed = isOni ? SPEED_ONI : SPEED_RUNNER;
    if (p.boostTimer > 0) {
        speed += ITEM_BOOST;
        p.boostTimer--;
    }

    if (keys[up]) p.y -= speed;
    if (keys[down]) p.y += speed;
    if (keys[left]) p.x -= speed;
    if (keys[right]) p.x += speed;

    // 画面外ブロック
    p.x = Math.max(0, Math.min(canvas.width - p.size, p.x));
    p.y = Math.max(0, Math.min(canvas.height - p.size, p.y));
}

function checkWallCollision(p) {
    const allWalls = [...obstacles, movingWall];
    allWalls.forEach(w => {
        if (p.x < w.x + w.w && p.x + p.size > w.x && p.y < w.y + w.h && p.y + p.size > w.y) {
            // めり込み防止の簡易処理（中心点からの方向で押し戻す）
            if (Math.abs((p.x + 12) - (w.x + w.w/2)) > Math.abs((p.y + 12) - (w.y + w.h/2))) {
                p.x = (p.x + 12 < w.x + w.w/2) ? w.x - p.size : w.x + w.w;
            } else {
                p.y = (p.y + 12 < w.y + w.h/2) ? w.y - p.size : w.y + w.h;
            }
        }
    });
}

function getDist(a, b) {
    return Math.sqrt((a.x - b.x)**2 + (a.y - b.y)**2);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 障害物
    ctx.fillStyle = '#555';
    obstacles.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));
    ctx.fillStyle = '#aaa';
    ctx.fillRect(movingWall.x, movingWall.y, movingWall.w, movingWall.h);

    // アイテム
    if (item.active) {
        ctx.fillStyle = 'yellow';
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.size, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'black';
        ctx.fillText("⚡", item.x-5, item.y+5);
    }

    // プレイヤー
    [pLeft, pRight].forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        
        // 鬼の目印
        const isOni = (currentRound === 1 && p === pLeft) || (currentRound === 2 && p === pRight);
        if (isOni) {
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.strokeRect(p.x - 2, p.y - 2, p.size + 4, p.size + 4);
            ctx.fillStyle = 'white';
            ctx.fillText("ONI", p.x, p.y - 5);
        }
        
        // ブーストエフェクト
        if (p.boostTimer > 0) {
            ctx.strokeStyle = 'yellow';
            ctx.strokeRect(p.x - 5, p.y - 5, p.size + 10, p.size + 10);
        }
    });
}
</script>

</body>
</html>
